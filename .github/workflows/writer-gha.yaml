name: writer-gha
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  writer-gha:
    name: writer-gha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: push one release commit with the workflow token
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/release-writer.sh one
