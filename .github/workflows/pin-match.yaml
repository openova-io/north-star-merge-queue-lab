name: pin-match
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pin-match:
    name: pin-match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compare the two version files
        run: |
          v=$(cat release/chart-version); p=$(cat release/slot-pin)
          echo "event=${{ github.event_name }} sha=$(git rev-parse HEAD) chart-version=$v slot-pin=$p"
          test "$v" = "$p"
