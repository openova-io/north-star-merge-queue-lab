name: push-probe
on:
  push:
    branches: [main]
permissions: {}
jobs:
  push-probe:
    name: push-probe
    runs-on: ubuntu-latest
    steps:
      - name: record who pushed
        run: |
          echo "actor=${{ github.actor }} triggering_actor=${{ github.triggering_actor }}"
          echo "pusher=${{ github.event.pusher.name }} sender=${{ github.event.sender.login }} sender_type=${{ github.event.sender.type }}"
          echo "before=${{ github.event.before }} after=${{ github.sha }}"
