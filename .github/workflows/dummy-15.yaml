name: dummy-15
on:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  dummy-15:
    name: dummy-15
    runs-on: ubuntu-latest
    steps:
      - name: record the event
        run: |
          echo "event=${{ github.event_name }} sha=${{ github.sha }} ref=${{ github.ref }}"
          echo "merge_group head=${{ github.event.merge_group.head_sha }} base=${{ github.event.merge_group.base_sha }}"
      - name: wait 90 seconds (stands for 15 minutes)
        run: sleep 90
